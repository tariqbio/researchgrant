services:
  - type: web
    name: grantbd
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: python start.sh
    healthCheckPath: /health
    # Render free tier sleeps after inactivity, which is acceptable for v1.
    envVars:
      # Required
      - key: DATABASE_URL
        fromDatabase:
          name: grantbd-db
          property: connectionString

      - key: SECRET_KEY
        # Any random 32+ character string. Generate with:
        # python3 -c "import secrets; print(secrets.token_hex(32))"
        generateValue: true

      - key: ADMIN_EMAIL
        # Your admin login email (created automatically on first deploy)
        sync: false

      - key: ADMIN_PASSWORD
        # Your admin login password
        sync: false

      # API keys can be added after the first successful deploy.
      - key: ANTHROPIC_API_KEY
        sync: false

      - key: SENDGRID_API_KEY
        sync: false

      - key: SENDGRID_FROM_EMAIL
        sync: false

      - key: ENVIRONMENT
        value: production

databases:
  - name: grantbd-db
    databaseName: grantbd
    user: grantbd_user
    plan: free
